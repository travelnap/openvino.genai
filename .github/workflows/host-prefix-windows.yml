name: Host prefix wheel

on:
  push:
    branches:
      - host-prefix-spill
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: cp312 Windows wheel
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip -OutFile ninja-win.zip
          Expand-Archive -Force ninja-win.zip -DestinationPath ninja
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\ninja"

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install the OpenVINO nightly this wheel links against
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install py-build-cmake==0.5.0 pybind11-stubgen==2.5.5 "cmake~=3.26.0" "openvino==2026.5.0.dev20261030" "openvino-tokenizers==2026.5.0.0.dev20261030" --extra-index-url https://storage.openvinotoolkit.org/simple/wheels/nightly

      - name: Build openvino-genai wheel
        shell: pwsh
        run: |
          python -m pip wheel -v --no-deps --no-build-isolation --wheel-dir dist --extra-index-url https://storage.openvinotoolkit.org/simple/wheels/nightly --config-settings=override=cmake.generator='Ninja' .

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: openvino-genai-cp312-win
          path: dist/*.whl
          if-no-files-found: error
